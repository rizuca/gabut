<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Dokumen Dinamis</title>
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pustaka untuk PDF & Tabel PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <!-- Pustaka untuk Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Font Google Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        /* Style untuk tab aktif */
        .tab-active {
            border-color: #4f46e5;
            color: #4f46e5;
            background-color: #eef2ff;
        }
        /* Transisi halus untuk semua elemen */
        * {
            transition: all 0.2s ease-in-out;
        }
        /* Placeholder styling */
        input::placeholder, textarea::placeholder {
            color: #9ca3af;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-4">

    <div class="w-full max-w-4xl mx-auto bg-white p-4 sm:p-6 md:p-8 rounded-2xl shadow-2xl shadow-gray-300/30">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-800">Generator Dokumen Dinamis</h1>
            <p class="text-gray-500 mt-2">Pilih format, sesuaikan konten, dan unduh dokumen Anda.</p>
        </div>

        <!-- Navigasi Tab -->
        <div class="mb-6 border-b border-gray-200">
            <nav class="flex -mb-px space-x-1" aria-label="Tabs">
                <button id="tab-word-pdf" class="tab-active w-1/2 py-4 px-1 text-center border-b-2 font-medium text-sm md:text-base">
                    Buat Word / PDF (dengan Tabel)
                </button>
                <button id="tab-excel" class="text-gray-500 hover:text-gray-700 hover:border-gray-300 w-1/2 py-4 px-1 text-center border-b-2 font-medium text-sm md:text-base">
                    Buat Excel (Sederhana)
                </button>
            </nav>
        </div>

        <!-- Konten untuk Tab Word/PDF -->
        <div id="content-word-pdf">
            <div class="space-y-6">
                <input type="text" id="judul_laporan" class="w-full text-xl font-semibold p-3 border-b-2 border-gray-200 focus:border-indigo-500 outline-none" placeholder="Masukkan Judul Dokumen Anda di Sini" value="Laporan Kinerja Tim Kuartal 3">
                
                <!-- Kontrol Tabel -->
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h3 class="font-semibold text-gray-700 mb-3">Kontrol Tabel</h3>
                    <div class="flex flex-wrap justify-center sm:justify-start gap-3">
                        <button id="add-row" class="flex items-center gap-2 bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                            Tambah Baris
                        </button>
                        <button id="add-col" class="flex items-center gap-2 bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                            Tambah Kolom
                        </button>
                        <button id="remove-col" class="flex items-center gap-2 bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 10a1 1 0 011-1h8a1 1 0 110 2H6a1 1 0 01-1-1z" clip-rule="evenodd" /></svg>
                            Hapus Kolom
                        </button>
                        <button id="merge-cells" class="flex items-center gap-2 bg-teal-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500">
                           <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M5 8a1 1 0 00-1 1v2a1 1 0 001 1h1V8H5z" /><path d="M14 8h-1v4h1a1 1 0 001-1V9a1 1 0 00-1-1z" /><path fill-rule="evenodd" d="M8 6h4a1 1 0 011 1v6a1 1 0 01-1 1H8a1 1 0 01-1-1V7a1 1 0 011-1zM4 6a2 2 0 00-2 2v4a2 2 0 002 2h2v2a1 1 0 102 0v-2h4v2a1 1 0 102 0v-2h2a2 2 0 002-2V8a2 2 0 00-2-2h-2V4a1 1 0 10-2 0v2H8V4a1 1 0 10-2 0v2H4z" clip-rule="evenodd" /></svg>
                            Gabungkan Sel
                        </button>
                    </div>
                </div>

                <!-- Container Tabel Dinamis -->
                <div class="overflow-x-auto bg-gray-50/50 rounded-lg p-1">
                    <table id="dynamic-table" class="w-full border-collapse">
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
             <!-- Tombol Aksi untuk Word/PDF -->
            <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
                <button id="download-pdf" class="flex-1 bg-red-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transform hover:scale-105">
                    Download .PDF
                </button>
                <button id="download-doc" class="flex-1 bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transform hover:scale-105">
                    Download .DOC
                </button>
            </div>
        </div>

        <!-- Konten untuk Tab Excel -->
        <div id="content-excel" class="hidden">
             <div class="space-y-6">
                <input type="text" id="excel-judul" class="w-full text-xl font-semibold p-3 border-b-2 border-gray-200 focus:border-indigo-500 outline-none" placeholder="Judul Spreadsheet" value="Data Penjualan Bulanan">
                <textarea id="excel-isi" rows="8" class="mt-1 block w-full p-3 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="Masukkan data Anda di sini. Setiap baris baru akan menjadi baris baru di Excel. Gunakan koma (,) untuk memisahkan kolom.&#10;Contoh:&#10;Produk A,100,50000&#10;Produk B,150,75000">Produk A,100,50000
Produk B,150,75000
Produk C,80,120000</textarea>
            </div>
            <!-- Tombol Aksi untuk Excel -->
            <div class="mt-8 flex justify-center">
                 <button id="download-excel" class="w-full sm:w-auto bg-green-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transform hover:scale-105">
                    Download .XLSX (Excel)
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Elemen DOM ---
        const tabWordPdf = document.getElementById('tab-word-pdf');
        const tabExcel = document.getElementById('tab-excel');
        const contentWordPdf = document.getElementById('content-word-pdf');
        const contentExcel = document.getElementById('content-excel');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');

        // --- Logika Tab ---
        function switchTab(activeTab) {
            if (activeTab === 'word-pdf') {
                tabWordPdf.classList.add('tab-active');
                tabExcel.classList.remove('tab-active');
                contentWordPdf.classList.remove('hidden');
                contentExcel.classList.add('hidden');
            } else {
                tabWordPdf.classList.remove('tab-active');
                tabExcel.classList.add('tab-active');
                contentWordPdf.classList.add('hidden');
                contentExcel.classList.remove('hidden');
            }
        }
        tabWordPdf.addEventListener('click', () => switchTab('word-pdf'));
        tabExcel.addEventListener('click', () => switchTab('excel'));

        // --- Logika Tabel Dinamis ---
        let colCount = 0;

        function createCell(type, placeholder, isHeader = false) {
            const cell = document.createElement(type);
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = placeholder;
            input.className = `w-full min-w-[150px] p-2 pl-8 outline-none bg-transparent ${isHeader ? 'font-bold text-center' : 'text-center'}`;
            cell.className = 'border border-gray-300 relative';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'cell-checkbox absolute top-1/2 left-2 -translate-y-1/2';
            
            cell.appendChild(checkbox);
            cell.appendChild(input);
            return cell;
        }

        function addRow() {
            const row = document.createElement('tr');
            for (let i = 0; i < colCount; i++) {
                row.appendChild(createCell('td', `Data ${i + 1}`));
            }
            const actionCell = document.createElement('td');
            actionCell.className = 'border border-gray-300 p-1 text-center';
            const removeBtn = document.createElement('button');
            removeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto text-red-500 hover:text-red-700" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" /></svg>';
            removeBtn.onclick = () => row.remove();
            actionCell.appendChild(removeBtn);
            row.appendChild(actionCell);
            tableBody.appendChild(row);
        }

        function addCol() {
            colCount++;
            const headerRow = document.querySelector('#table-head tr');
            const actionHeader = headerRow.querySelector('th:last-child');
            headerRow.insertBefore(createCell('th', `Header ${colCount}`, true), actionHeader);
            document.querySelectorAll('#table-body tr').forEach(row => {
                const actionCell = row.querySelector('td:last-child');
                row.insertBefore(createCell('td', `Data ${colCount}`), actionCell);
            });
        }

        // --- [BUG FIX] Fungsi Hapus Kolom yang Diperbarui ---
        function removeCol() {
            if (colCount <= 1) return; // Mencegah penghapusan kolom terakhir

            document.querySelectorAll('#dynamic-table tr').forEach(row => {
                let visualColIndex = 0;
                const cells = Array.from(row.children);
                
                // Iterasi melalui sel untuk menemukan sel yang menempati kolom terakhir
                for (let i = 0; i < cells.length; i++) {
                    const cell = cells[i];
                    // Lewati sel aksi (tombol hapus baris)
                    if (cell.querySelector('button')) {
                        continue;
                    }

                    const span = cell.colSpan || 1;
                    
                    // Kondisi ini menemukan sel yang rentangnya (span) mencakup kolom visual terakhir
                    if (visualColIndex + span >= colCount) {
                        if (span > 1) {
                            // Jika sel digabungkan, kurangi saja rentangnya (colspan)
                            cell.colSpan = span - 1;
                        } else {
                            // Jika sel normal, hapus sel tersebut
                            row.removeChild(cell);
                        }
                        break; // Pindah ke baris berikutnya setelah penyesuaian selesai
                    }
                    
                    visualColIndex += span;
                }
            });

            colCount--; // Kurangi jumlah total kolom
        }
        
        function initTable(rows, cols) {
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';
            colCount = 0;
            const headerRow = document.createElement('tr');
            tableHead.appendChild(headerRow);
            const actionHeader = document.createElement('th');
            actionHeader.className = 'border border-gray-300 p-2 min-w-[50px]';
            actionHeader.innerText = 'Aksi';
            for (let i = 0; i < cols; i++) {
                colCount++;
                headerRow.appendChild(createCell('th', `Header ${i + 1}`, true));
            }
            headerRow.appendChild(actionHeader);
            for (let i = 0; i < rows; i++) {
                addRow();
            }
        }
        
        document.getElementById('add-row').addEventListener('click', addRow);
        document.getElementById('add-col').addEventListener('click', addCol);
        document.getElementById('remove-col').addEventListener('click', removeCol);

        document.getElementById('merge-cells').addEventListener('click', () => {
            document.querySelectorAll('#dynamic-table tr').forEach(row => {
                const selectedCells = Array.from(row.querySelectorAll('td:has(.cell-checkbox:checked), th:has(.cell-checkbox:checked)'));
                if (selectedCells.length < 2) return;

                const cellIndices = selectedCells.map(cell => Array.from(row.children).indexOf(cell)).sort((a, b) => a - b);
                let isContiguous = true;
                for (let i = 0; i < cellIndices.length - 1; i++) {
                    if (cellIndices[i + 1] !== cellIndices[i] + 1) {
                        isContiguous = false;
                        break;
                    }
                }

                if (!isContiguous) {
                    console.warn("Hanya sel yang bersebelahan yang dapat digabungkan. Melewatkan baris ini.");
                    return;
                }

                const firstCell = selectedCells[0];
                const mergeCount = selectedCells.length;
                const combinedText = selectedCells.map(cell => cell.querySelector('input[type="text"]').value).filter(Boolean).join(' / ');

                firstCell.colSpan = (firstCell.colSpan || 1) + mergeCount - 1;
                firstCell.querySelector('input[type="text"]').value = combinedText;

                for (let i = 1; i < selectedCells.length; i++) {
                    selectedCells[i].remove();
                }
            });
            document.querySelectorAll('.cell-checkbox').forEach(cb => cb.checked = false);
        });

        // --- Logika Download ---
        document.getElementById('download-pdf').addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });
            const title = document.getElementById('judul_laporan').value || "Laporan Default";
            doc.setFontSize(18);
            doc.text(title, 14, 22);
            
            const head = [];
            const body = [];

            document.querySelectorAll('#table-head tr').forEach(tr => {
                const headRow = [];
                tr.querySelectorAll('th').forEach(th => {
                    if (Array.from(th.parentElement.children).indexOf(th) === th.parentElement.children.length - 1) return;
                    headRow.push({
                        content: th.querySelector('input[type="text"]').value,
                        colSpan: th.colSpan || 1,
                        styles: { fontStyle: 'bold', halign: 'center' }
                    });
                });
                head.push(headRow);
            });

            document.querySelectorAll('#table-body tr').forEach(tr => {
                const bodyRow = [];
                tr.querySelectorAll('td').forEach(td => {
                    if (Array.from(td.parentElement.children).indexOf(td) === td.parentElement.children.length - 1) return;
                    bodyRow.push({
                        content: td.querySelector('input[type="text"]').value,
                        colSpan: td.colSpan || 1
                    });
                });
                body.push(bodyRow);
            });

            doc.autoTable({
                head: head,
                body: body,
                startY: 30,
                theme: 'grid',
                styles: { font: 'Inter', cellPadding: 2.5, fontSize: 10 },
                headStyles: { fillColor: [79, 70, 229] }
            });
            doc.save(`${title.replace(/ /g, "_")}.pdf`);
        });

        document.getElementById('download-doc').addEventListener('click', () => {
            const title = document.getElementById('judul_laporan').value || "Laporan Default";
            const tableClone = document.getElementById('dynamic-table').cloneNode(true);
            
            tableClone.querySelectorAll('th, td').forEach(cell => {
                cell.querySelector('.cell-checkbox')?.remove();
                const input = cell.querySelector('input[type="text"]');
                if (input) cell.textContent = input.value;
                cell.style.padding = '8px';
                cell.style.border = '1px solid #ccc';
                if (cell.tagName === 'TH') {
                    cell.style.backgroundColor = '#f2f2f2';
                    cell.style.fontWeight = 'bold';
                }
            });

            tableClone.querySelector('thead tr th:last-child')?.remove();
            tableClone.querySelectorAll('tbody tr').forEach(row => row.querySelector('td:last-child')?.remove());

            const tableHtml = tableClone.outerHTML;
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export</title></head><body>";
            const footer = "</body></html>";
            const sourceHTML = `${header}<h1>${title}</h1><br>${tableHtml}${footer}`;
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = `${title.replace(/ /g, "_")}.doc`;
            fileDownload.click();
            document.body.removeChild(fileDownload);
        });

        document.getElementById('download-excel').addEventListener('click', () => {
            const title = document.getElementById('excel-judul').value || "Data Default";
            const content = document.getElementById('excel-isi').value;
            const data = content.split('\n').map(row => row.split(','));
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data");
            XLSX.writeFile(wb, `${title.replace(/ /g, "_")}.xlsx`);
        });

        window.onload = () => {
            switchTab('word-pdf');
            initTable(8, 5); 
            document.querySelector('#table-head th:nth-child(1) input').value = "Nama Produk";
            document.querySelector('#table-head th:nth-child(2) input').value = "Kategori";
            document.querySelector('#table-head th:nth-child(3) input').value = "Unit Terjual";
            document.querySelector('#table-head th:nth-child(4) input').value = "Pendapatan";
            document.querySelector('#table-head th:nth-child(5) input').value = "Status";
        };
    </script>
</body>
</html>
